name: asn-supply

services:
  redis:
    image: redis:7-alpine
    container_name: asn-supply-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - asn_redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  asn_redis_data:
