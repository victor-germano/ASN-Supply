packages:
  - "apps/*"
  - "packages/*"

# Correções de segurança em dependências indiretas. O pnpm 9 (versão do
# projeto) lê estas regras do `package.json` ("pnpm.overrides"); do pnpm 10
# em diante, só daqui. Manter as duas listas iguais.
overrides:
  multer: ^2.4.0
  lodash: ^4.18.1
  postcss: ^8.5.28
  nanoid@3: ^3.3.19
  fast-uri: ^3.1.8
  js-yaml@4: ^4.3.2
  brace-expansion@1: ^1.1.21
  brace-expansion@5: ^5.0.12
  uuid@11: ^11.1.1
  qs: ^6.16.0
  webpack: ^5.111.1
  body-parser@1: ^1.20.8
  sharp: ^0.35.5