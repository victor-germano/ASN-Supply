name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Lint, typecheck, test & build
    runs-on: ubuntu-latest
    services:
      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      REDIS_URL: redis://localhost:6379
      JWT_SECRET: ci-only-secret-must-be-at-least-32-characters-long
      NEXT_PUBLIC_SITE_URL: http://localhost:3100
      NEXT_PUBLIC_API_URL: http://localhost:3400/v1
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.0

      - uses: actions/setup-node@v4
        with:
          node-version-file: ".nvmrc"
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Test
        run: pnpm test

      - name: Build
        run: pnpm build

  e2e:
    name: End-to-end (Playwright)
    runs-on: ubuntu-latest
    # Só roda depois de lint/typecheck/test/build passarem — não vale gastar
    # o tempo (bem maior) de subir os dois apps + navegador só pra falhar
    # num erro de lint que já teria sido pego antes.
    needs: quality
    services:
      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      REDIS_URL: redis://localhost:6379
      JWT_SECRET: ci-only-secret-must-be-at-least-32-characters-long
      # Lida pela API e pelo servidor do site (mesmo valor nos dois) — sem
      # ela, todos os testes paralelos dividem um único limite de requisições.
      INTERNAL_API_KEY: ci-only-internal-key-at-least-32-characters
      NODE_ENV: production
      PORT: 3400
      # ATENÇÃO — gap conhecido (ver docs/DEPLOY.md e discussão da Fase 7 da
      # migração Postgres→Firestore): estas três ficam obrigatórias em
      # produção desde que o Prisma/Postgres saiu do projeto, mas este repo
      # não tem nenhum Firebase/Algolia dedicado a CI configurado (zero
      # secrets cadastrados) — sem valores reais aqui, a API se recusa a
      # subir no passo "Start API and Web" abaixo, e este job nunca chega a
      # rodar de verdade. Precisa de um projeto Firebase + app Algolia
      # dedicados a teste (nunca o de produção) com os segredos cadastrados
      # em Settings → Secrets and variables → Actions antes deste job voltar
      # a funcionar.
      CLOUDINARY_URL: ${{ secrets.CI_CLOUDINARY_URL }}
      FIREBASE_SERVICE_ACCOUNT_BASE64: ${{ secrets.CI_FIREBASE_SERVICE_ACCOUNT_BASE64 }}
      ALGOLIA_APP_ID: ${{ secrets.CI_ALGOLIA_APP_ID }}
      ALGOLIA_ADMIN_API_KEY: ${{ secrets.CI_ALGOLIA_ADMIN_API_KEY }}
      # Inline-adas no bundle do client NO MOMENTO DO BUILD (Next.js não lê
      # `NEXT_PUBLIC_*` em runtime) — precisam estar corretas ANTES do passo
      # de build abaixo, não só na hora de rodar os testes.
      NEXT_PUBLIC_SITE_URL: http://localhost:3100
      NEXT_PUBLIC_API_URL: http://localhost:3400/v1
      PLAYWRIGHT_BASE_URL: http://localhost:3100
      # Os dois apps já são subidos manualmente pelos passos abaixo (build de
      # produção, não `next dev`) — sem isso, o `webServer` do Playwright
      # tentaria subir um SEGUNDO `next dev` e colidiria com o processo que
      # já está rodando (mesmo problema já documentado em docs/HISTORICO.md).
      PLAYWRIGHT_SKIP_WEBSERVER: "1"
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.0

      - uses: actions/setup-node@v4
        with:
          node-version-file: ".nvmrc"
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Playwright browsers
        run: pnpm --filter @asn/web exec playwright install --with-deps chromium

      # O seed de teste (contas admin de e2e, apaga tudo antes) se recusa a
      # rodar com NODE_ENV=production — aqui o Firestore de teste é descartável.
      - name: Seed database
        run: pnpm --filter @asn/api db:seed
        env:
          NODE_ENV: development

      - name: Build
        run: pnpm build

      # Os dois `&` e o `wait-on` num único passo — processo em background
      # continua rodando nos passos seguintes do mesmo job (mesma VM, sem
      # container por passo), mas só depois de confirmado no ar aqui, não
      # antes: iniciar e aguardar juntos evita corrida entre "subiu" e
      # "está pronto pra responder request".
      - name: Start API and Web (background), wait until both respond
        run: |
          pnpm --filter @asn/api start &
          pnpm --filter @asn/web start &
          npx wait-on --timeout 60000 http://localhost:3400/v1/health http://localhost:3100

      - name: Run Playwright tests
        run: pnpm --filter @asn/web test:e2e

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: apps/web/playwright-report/
          retention-days: 7
